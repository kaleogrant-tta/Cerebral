name: Cerebral refresh

on:
  schedule:
    # 11:00 America/New_York, daily.
    # GitHub cron is UTC and does not observe DST, so this is 15:00 UTC
    # (11:00 EDT). Between November and March it lands at 10:00 EST —
    # change to '0 16 * * *' if that matters.
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: cerebral-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cerebral
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TTA_DRIVE_INBOX:   ${{ secrets.TTA_DRIVE_INBOX }}
          TTA_DRIVE_ARCHIVE: ${{ secrets.TTA_DRIVE_ARCHIVE }}
          TTA_DRIVE_STATE:   ${{ secrets.TTA_DRIVE_STATE }}
          TTA_SHEET_ID:      ${{ secrets.TTA_SHEET_ID }}
        run: python tta_refresh.py

      - name: Note failure
        if: failure()
        run: echo "::error::Refresh failed. Drive state unchanged — safe to re-run from the Actions tab."

