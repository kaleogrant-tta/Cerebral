name: Cerebral refresh
on:
  workflow_dispatch:
concurrency:
  group: cerebral-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cerebral
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TTA_DRIVE_INBOX:   ${{ secrets.TTA_DRIVE_INBOX }}
          TTA_DRIVE_ARCHIVE: ${{ secrets.TTA_DRIVE_ARCHIVE }}
          TTA_DRIVE_STATE:   ${{ secrets.TTA_DRIVE_STATE }}
          TTA_SHEET_ID:      ${{ secrets.TTA_SHEET_ID }}
        run: python tta_refresh.py

      # Rebuild and upload the dashboard data file from the JUST-UPDATED
      # database, so the online dashboard (including the Takeover GWP
      # reconciliation) refreshes itself after every run — no local
      # publish step needed to watch a promotion as it runs.
      # Floor-set placements from the live Google Sheet (link-shared, no secret)
      - name: Ingest floor sets
        run: python vm_ingest.py --db /tmp/tta_work/tta.duckdb --workbook /tmp/tta_work/Visual_Merchandise_Data_2026.xlsx

      # Stock levels: Dutchie inventory exports live in the Drive state folder;
      # anchors on the newest Monday snapshot already in fact_inventory
      - name: Ingest inventory ledgers
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TTA_DRIVE_STATE:   ${{ secrets.TTA_DRIVE_STATE }}
        run: python inv_ingest.py --from-drive --db /tmp/tta_work/tta.duckdb --since 2025-12-01

      # Build the dashboard file (no upload here - publish_vm.py ships it)
      - name: Publish dashboard file
        run: python publish.py --db /tmp/tta_work/tta.duckdb

      # Add the Visual Merch tables (no upload yet - the validation gate runs first)
      - name: Publish VM tables
        run: python publish_vm.py --src /tmp/tta_work/tta.duckdb

      # Validation gate: structural / reconciliation / invariant checks on the
      # finished dash file. Any FAIL stops the run before Drive is touched.
      - name: Validate dashboard file
        run: python checks.py --dash cerebral_dash.duckdb --db /tmp/tta_work/tta.duckdb

      # Upload. publish.py --upload would rebuild without the VM tables, so the
      # upload lives here (publish_vm.py re-adds the same tables, then pushes).
      - name: Upload dashboard file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TTA_DRIVE_STATE:   ${{ secrets.TTA_DRIVE_STATE }}
        run: python publish_vm.py --src /tmp/tta_work/tta.duckdb --upload

      - name: Note failure
        if: failure()
        run: echo "::error::Refresh failed. Drive state unchanged — safe to re-run from the Actions tab."
